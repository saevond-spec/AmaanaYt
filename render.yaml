services:
  - type: web
    name: amaana-yt
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: UPLOAD_DIR
        value: /tmp/uploads
    disk:
      name: amaana-data
      mountPath: /var/data
      sizeGB: 1
