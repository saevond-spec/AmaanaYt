services:
  - type: web
    name: amaana-yt
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_CHANNEL_HANDLE
        value: '@saevond'
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: AGENT_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: SEO_AI_API_KEY
        sync: false
      - key: SEO_AI_MODEL
        sync: false
      - key: SEO_AI_BASE_URL
        sync: false
      - key: VIDIQ_MCP_API_KEY
        sync: false
      - key: VIDIQ_MARKET_RESEARCH
        value: 'true'
      - key: VIDIQ_WEEKLY_CREDIT_LIMIT
        value: '5'
      - key: VIDIQ_MCP_URL
        value: 'https://mcp.vidiq.com/mcp'
      - key: SEO_AI_TIMEOUT_MS
        value: '120000'
      - key: SEO_DAILY_LIMIT
        value: '200'
      - key: SEO_AUTO_PUBLISH
        value: 'true'
      - key: SEO_MARKET_RESEARCH
        value: 'true'
      - key: YOUTUBE_PUBLIC_LIVE_MONETIZATION
        value: 'true'
      - key: SEO_AUTO_DAILY_LIMIT
        value: '15'
      - key: SEO_SCAN_INTERVAL_MINUTES
        value: '15'
      - key: ENABLE_VIDEO_ANALYSIS
        value: 'true'
      - key: VIDEO_ANALYSIS_API_KEY
        sync: false
      - key: VIDEO_ANALYSIS_TIMEOUT_MS
        value: '180000'
      - key: ENABLE_GAMEPLAY_SCREENING
        value: 'true'
      - key: HIGHLIGHT_AUTO_PUBLISH
        value: 'true'
      - key: UPLOAD_DIR
        value: /tmp/uploads
