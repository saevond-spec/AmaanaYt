services:
  - type: web
    name: amaana-yt
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: AGENT_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: SEO_AI_API_KEY
        sync: false
      - key: SEO_AI_MODEL
        sync: false
      - key: SEO_AI_BASE_URL
        value: https://api.openai.com/v1
      - key: SEO_DAILY_LIMIT
        value: '20'
      - key: UPLOAD_DIR
        value: /tmp/uploads
