name: Check Short views

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Amaana for YouTube view checks
        run: curl --fail --silent --show-error --retry 2 --retry-delay 20 --retry-all-errors --max-time 150 https://amaana-yt.onrender.com/healthz
